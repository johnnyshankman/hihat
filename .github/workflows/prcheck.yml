name: PR Check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint & Build
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Security audit (production dependencies)
      run: npm audit --omit=dev --audit-level=high

    - name: Typecheck
      run: npm run typecheck

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Unit tests
      run: npm test

  changes:
    name: Detect E2E-Relevant Changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          e2e:
            - 'src/**'
            - 'e2e/**'
            - '.erb/**'
            - 'assets/**'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig.json'
            - 'playwright.config.ts'
            - 'postcss.config.js'
            - '.github/workflows/prcheck.yml'

  e2e:
    name: E2E Tests
    needs: [check, changes]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
    - name: Skip notice
      if: needs.changes.outputs.e2e != 'true'
      run: echo "No E2E-relevant changes detected; skipping E2E tests."

    - uses: actions/checkout@v6
      if: needs.changes.outputs.e2e == 'true'
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6
      if: needs.changes.outputs.e2e == 'true'
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      if: needs.changes.outputs.e2e == 'true'
      run: npm ci

    # NOTE: Do NOT add `playwright install`. These E2E tests drive the app via
    # Playwright's Electron integration (`_electron.launch`), which launches the
    # `electron` dependency's own binary — not a Playwright-managed browser.
    # That standalone-Chromium download stalls indefinitely on the macOS runner
    # and is never used.
    #
    # The `electron` package (v42) ships no postinstall, so `npm ci` does NOT
    # fetch its binary. Left alone it downloads lazily on first
    # `require('electron')` *inside* the test run — blowing each launch timeout
    # and re-downloading on every worker restart ("Downloading Electron
    # binary..." on a loop). Provision it up front so the tests start ready.
    - name: Install Electron binary
      if: needs.changes.outputs.e2e == 'true'
      run: node node_modules/electron/install.js

    - name: Build
      if: needs.changes.outputs.e2e == 'true'
      run: npm run build

    - name: Run E2E tests
      if: needs.changes.outputs.e2e == 'true'
      run: npx playwright test
      env:
        CI: true
        NODE_ENV: test
